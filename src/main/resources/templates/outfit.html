<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Outfit Suggestion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .outfit-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .outfit-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .outfit-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .outfit-card h2 {
            color: #667eea;
            font-size: 1.5em;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .outfit-card h2::before {
            font-size: 1.2em;
        }

        .outfit-card h2:nth-of-type(1)::before {
            content: "👕";
        }

        .item-content {
            text-align: center;
        }

        .item-content p {
            color: #333;
            font-size: 1.1em;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .item-content img {
            max-width: 100%;
            height: 200px;
            object-fit: contain;
            border-radius: 10px;
            background: #f9f9f9;
            padding: 10px;
        }

        .no-item {
            color: #999;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }

        .accessories-list {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .accessories-list li {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: background 0.3s ease;
        }

        .accessories-list li:hover {
            background: #f0f0f0;
        }

        .accessories-list span {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .accessories-list img {
            max-width: 100%;
            height: 100px;
            object-fit: contain;
            border-radius: 5px;
        }

        .mannequin-section {
            background: white;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .mannequin-section h2 {
            color: #667eea;
            font-size: 1.8em;
            margin-bottom: 20px;
        }

        #mannequin {
            background: linear-gradient(to bottom, #f9f9f9, #e9e9e9);
            border-radius: 10px;
            padding: 60px 20px;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px dashed #ddd;
        }

        #mannequin p {
            color: #999;
            font-size: 1.2em;
            font-style: italic;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        button, .back-link {
            padding: 14px 30px;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .back-link {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .back-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .no-outfit {
            background: white;
            border-radius: 15px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            margin: 100px auto;
        }

        .no-outfit p {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        .icon-large {
            font-size: 4em;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .outfit-grid {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                flex-direction: column;
            }

            button, .back-link {
                width: 100%;
            }
        }

        /* Animation */
        .outfit-card, .mannequin-section {
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .outfit-card:nth-child(1) { animation-delay: 0.1s; }
        .outfit-card:nth-child(2) { animation-delay: 0.2s; }
        .outfit-card:nth-child(3) { animation-delay: 0.3s; }
        .mannequin-section { animation-delay: 0.4s; }
    </style>
</head>
<body>
<div class="container">
    <h1>✨ Your Perfect Outfit ✨</h1>

    <div th:if="${outfit != null}">
        <div class="outfit-grid">
            <!-- Topwear Card -->
            <div class="outfit-card">
                <h2>👕 Topwear</h2>
                <div th:if="${outfit.topwear != null}" class="item-content">
                    <p th:text="${outfit.topwear.name}"></p>
                    <img th:src="${outfit.topwear.imagePath}" alt="Topwear Image" />
                </div>
                <div th:if="${outfit.topwear == null}" class="no-item">
                    <p>No topwear suggested.</p>
                </div>
            </div>

            <!-- Bottomwear Card -->
            <div class="outfit-card">
                <h2>👖 Bottomwear</h2>
                <div th:if="${outfit.bottomwear != null}" class="item-content">
                    <p th:text="${outfit.bottomwear.name}"></p>
                    <img th:src="${outfit.bottomwear.imagePath}" alt="Bottomwear Image" />
                </div>
                <div th:if="${outfit.bottomwear == null}" class="no-item">
                    <p>No bottomwear suggested.</p>
                </div>
            </div>

            <!-- Accessories Card -->
            <div class="outfit-card">
                <h2>👜 Accessories</h2>
                <ul th:if="${outfit.accessories != null and !outfit.accessories.empty}" class="accessories-list">
                    <li th:each="accessory : ${outfit.accessories}">
                        <span th:text="${accessory.name}"></span>
                        <img th:src="${accessory.imagePath}" alt="Accessory Image" />
                    </li>
                </ul>
                <div th:if="${outfit.accessories == null or outfit.accessories.empty}" class="no-item">
                    <p>No accessories suggested.</p>
                </div>
            </div>
        </div>

        <!-- Mannequin Section -->
        <div class="mannequin-section">
            <h2>👤 Try-On View</h2>
            <div id="mannequin">
                <p>Mannequin View Coming Soon</p>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <form action="/suggest" method="post" style="display: inline;">
                <input type="hidden" name="climate" th:value="${outfit.climate}" />
                <input type="hidden" name="personType" th:value="${outfit.personType}" />
                <button type="submit">🔄 Refresh Outfit</button>
            </form>
            <a href="/" class="back-link">🏠 Back to Home</a>
        </div>
    </div>

    <div th:if="${outfit == null}" class="no-outfit">
        <div class="icon-large">😔</div>
        <p>No outfit found for the selected criteria.</p>
        <a href="/" class="back-link">🏠 Back to Home</a>
    </div>
</div>
</body>
</html>
