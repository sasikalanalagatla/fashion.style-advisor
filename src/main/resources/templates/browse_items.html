<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Browse Items - Style Advisor</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(
          135deg,
          #1e3c72 0%,
          #2a5298 50%,
          #7e22ce 100%
        );
        min-height: 100vh;
        padding: 40px 20px;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
      }

      .page-header {
        text-align: center;
        margin-bottom: 50px;
        animation: fadeIn 0.8s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .page-header h1 {
        color: white;
        font-size: 2.5em;
        margin-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        font-weight: 700;
      }

      .page-header p {
        color: rgba(255, 255, 255, 0.9);
        font-size: 1.1em;
        margin-bottom: 20px;
      }

      .filter-section {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 25px;
        margin-bottom: 40px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        align-items: center;
      }

      .filter-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .filter-group label {
        font-weight: 600;
        color: #333;
        font-size: 0.9em;
      }

      .filter-group select {
        padding: 10px 15px;
        border: 2px solid #e5e7eb;
        border-radius: 10px;
        font-size: 0.95em;
        font-family: "Poppins", sans-serif;
        cursor: pointer;
        min-width: 180px;
      }

      .items-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 25px;
        margin-bottom: 40px;
      }

      .item-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        cursor: pointer;
        animation: slideUp 0.6s ease-out backwards;
        display: flex;
        flex-direction: column;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(50px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .item-card:hover {
        transform: translateY(-15px) scale(1.02);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
      }

      .item-image-wrapper {
        background: linear-gradient(135deg, #f9fafb, #e5e7eb);
        border-radius: 15px;
        padding: 30px 20px;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 200px;
        overflow: hidden;
        position: relative;
      }

      .item-image-wrapper img {
        max-width: 100%;
        max-height: 180px;
        object-fit: contain;
        transition: transform 0.3s ease;
        background: #f0f0f0;
        display: block;
      }

      .item-image-wrapper img[src=""] {
        content: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect fill="%23f0f0f0" width="100" height="100"/><text x="50" y="50" text-anchor="middle" dy=".3em" fill="%23999" font-size="14">No Image</text></svg>');
      }

      .item-card:hover .item-image-wrapper img {
        transform: scale(1.1);
      }

      .item-details {
        flex-grow: 1;
        margin-bottom: 15px;
      }

      .item-name {
        font-weight: 600;
        color: #1e3c72;
        font-size: 1.1em;
        margin-bottom: 8px;
        word-break: break-word;
      }

      .item-meta {
        font-size: 0.85em;
        color: #666;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .meta-item {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .meta-item::before {
        content: "•";
        color: #667eea;
        font-weight: bold;
      }

      .select-btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        font-family: "Poppins", sans-serif;
      }

      .select-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
      }

      .action-buttons {
        display: flex;
        gap: 15px;
        justify-content: center;
        margin-top: 40px;
        flex-wrap: wrap;
      }

      .btn {
        padding: 14px 35px;
        border-radius: 12px;
        font-size: 1em;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        border: none;
        font-family: "Poppins", sans-serif;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
      }

      .btn-primary:hover {
        transform: translateY(-3px);
        box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
      }

      .btn-secondary {
        background: white;
        color: #667eea;
        border: 2px solid white;
        box-shadow: 0 10px 30px rgba(255, 255, 255, 0.3);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.9);
        transform: translateY(-3px);
      }

      .empty-state {
        text-align: center;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        padding: 60px 40px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
      }

      .empty-state-icon {
        font-size: 80px;
        margin-bottom: 20px;
      }

      .empty-state p {
        color: #666;
        font-size: 1.2em;
        margin-bottom: 20px;
      }

      @media (max-width: 768px) {
        .filter-section {
          flex-direction: column;
        }

        .filter-group select {
          width: 100%;
          min-width: unset;
        }

        .page-header h1 {
          font-size: 2em;
        }

        .items-grid {
          grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
          gap: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="page-header">
        <h1>👕 Browse Items</h1>
        <p>Select your favorite clothing items</p>
      </div>

      <div class="filter-section">
        <div class="filter-group">
          <label for="climate">Climate</label>
          <select id="climate" th:value="${selectedClimate}">
            <option value="">All Climates</option>
            <option
              th:each="climate : ${climates}"
              th:value="${climate}"
              th:text="${climate}"
            ></option>
          </select>
        </div>
        <div class="filter-group">
          <label for="personType">Person Type</label>
          <select id="personType" th:value="${selectedPersonType}">
            <option value="">All Types</option>
            <option
              th:each="type : ${personTypes}"
              th:value="${type}"
              th:text="${type}"
            ></option>
          </select>
        </div>
        <div class="filter-group">
          <label for="category">Category</label>
          <select id="category" th:value="${selectedCategory}">
            <option value="">All Categories</option>
            <option
              th:each="cat : ${categories}"
              th:value="${cat}"
              th:text="${cat}"
            ></option>
          </select>
        </div>
        <button onclick="applyFilters()" class="btn btn-primary">
          🔍 Filter
        </button>
      </div>

      <div th:if="${not #lists.isEmpty(items)}" class="items-grid">
        <div th:each="item : ${items}" class="item-card">
          <div class="item-image-wrapper">
            <svg
              th:if="${item.category == 'TOP'}"
              xmlns="http://www.w3.org/2000/svg"
              width="200"
              height="200"
              viewBox="0 0 200 200"
              style="position: absolute; opacity: 0.2"
            >
              <rect fill="#6C5CE7" width="200" height="200" />
              <text
                x="50%"
                y="50%"
                text-anchor="middle"
                dy=".3em"
                fill="white"
                font-size="60"
                font-weight="bold"
              >
                👕
              </text>
            </svg>
            <svg
              th:if="${item.category == 'BOTTOM'}"
              xmlns="http://www.w3.org/2000/svg"
              width="200"
              height="200"
              viewBox="0 0 200 200"
              style="position: absolute; opacity: 0.2"
            >
              <rect fill="#FF6B6B" width="200" height="200" />
              <text
                x="50%"
                y="50%"
                text-anchor="middle"
                dy=".3em"
                fill="white"
                font-size="60"
                font-weight="bold"
              >
                👖
              </text>
            </svg>
            <svg
              th:if="${item.category == 'ACCESSORY'}"
              xmlns="http://www.w3.org/2000/svg"
              width="200"
              height="200"
              viewBox="0 0 200 200"
              style="position: absolute; opacity: 0.2"
            >
              <rect fill="#FFD93D" width="200" height="200" />
              <text
                x="50%"
                y="50%"
                text-anchor="middle"
                dy=".3em"
                fill="white"
                font-size="60"
                font-weight="bold"
              >
                👜
              </text>
            </svg>
            <img
              th:src="${item.imagePath}"
              th:alt="${item.name}"
              loading="eager"
              style="position: relative; z-index: 1"
            />
          </div>
          <div class="item-details">
            <div class="item-name" th:text="${item.name}">Item Name</div>
            <div class="item-meta">
              <div class="meta-item">
                <span th:text="${item.category}">Category</span>
              </div>
              <div class="meta-item">
                <span th:text="${item.climate}">Climate</span>
              </div>
              <div class="meta-item">
                <span th:text="${item.personType}">Person Type</span>
              </div>
            </div>
          </div>
          <form
            th:action="@{/suggest-with-item}"
            method="post"
            style="width: 100%"
          >
            <input type="hidden" name="itemId" th:value="${item.id}" />
            <input type="hidden" name="category" th:value="${item.category}" />
            <input type="hidden" name="climate" th:value="${item.climate}" />
            <input
              type="hidden"
              name="personType"
              th:value="${item.personType}"
            />
            <button type="submit" class="select-btn">
              ✨ Select & Update Outfit
            </button>
          </form>
        </div>
      </div>

      <div th:if="${#lists.isEmpty(items)}" class="empty-state">
        <div class="empty-state-icon">🤔</div>
        <p>No items found with the selected filters</p>
      </div>

      <div class="action-buttons">
        <a href="/" class="btn btn-secondary">🏠 Back to Home</a>
      </div>
    </div>

    <script>
      function applyFilters() {
        const climate = document.getElementById("climate").value;
        const personType = document.getElementById("personType").value;
        const category = document.getElementById("category").value;

        let url = `/browse?`;
        const params = [];
        if (climate) params.push(`climate=${climate}`);
        if (personType) params.push(`personType=${personType}`);
        if (category) params.push(`category=${category}`);

        window.location.href = url + params.join("&");
      }
    </script>
  </body>
</html>
